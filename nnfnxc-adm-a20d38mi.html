<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    style-src 'self' 'unsafe-inline' https:;
    connect-src 'self' https://xayagdicjwexwtehdjby.supabase.co wss://xayagdicjwexwtehdjby.supabase.co https://api.qrserver.com;
    img-src 'self' data: https: blob:;
    font-src 'self' data: https:;
  ">
  <title>艾產品管理系統 - 溯源履歷升級版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>

  <style>
    body { background-color: #0a0f1d; color: #f8fafc; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    input, textarea, select, td, th { -webkit-user-select: text !important; user-select: text !important; }
    .bg-panel { background-color: #141e33; }
    .bg-sub { background-color: #0d1527; }
    .border-theme { border-color: #223254; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="p-3 md:p-6 text-sm">

<div class="max-w-7xl mx-auto flex flex-col gap-4">
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-theme gap-3">
    <div>
      <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 text-white">
        🌿 艾產品管理系統
        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-900 text-indigo-300 font-normal">溯源履歷版</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">即時同步前台菜單、發貨、圖庫與庫存中台</p>
    </div>
    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
      <div id="accountStatus" class="flex items-center gap-2 mr-2 border-r border-theme pr-4">
         <span id="userEmailLabel" class="text-xs text-slate-400">未登入</span>
         <button id="btnLoginOut" onclick="toggleLogin()" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-xs text-white font-bold">登入</button>
      </div>
      <button onclick="exportCSV()" class="px-3 py-1.5 rounded bg-sky-500 text-slate-900 font-bold text-xs">📤 匯出台帳</button>
    </div>
  </header>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5">
    <div class="bg-panel border border-theme rounded-lg p-3"><div class="text-xs text-slate-400">納管品項 (SKUs)</div><div class="text-xl font-bold text-sky-400 mt-1" id="kpiSkuTotal">0</div></div>
    <div class="bg-panel border border-theme rounded-lg p-3"><div class="text-xs text-slate-400">庫存總值 (RMB)</div><div class="text-xl font-bold text-white mt-1" id="kpiTotalValue">¥0</div></div>
    <div class="bg-panel border border-theme rounded-lg p-3"><div class="text-xs text-slate-400">待發貨訂單</div><div class="text-xl font-bold text-indigo-400 mt-1" id="kpiPendingOrder">0</div></div>
    <div class="bg-panel border border-theme rounded-lg p-3"><div class="text-xs text-slate-400">有效自定義類別</div><div class="text-xl font-bold text-emerald-400 mt-1" id="kpiCategoryTotal">0</div></div>
    <div class="bg-panel border border-theme rounded-lg p-3 col-span-2 md:col-span-1"><div class="text-xs text-slate-400">零庫存斷貨品項</div><div class="text-xl font-bold text-rose-500 mt-1" id="kpiZeroStock">0</div></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    <!-- 左側：異動登記 -->
    <div class="lg:col-span-4 bg-panel border border-theme rounded-lg p-4 relative">
      <div id="authOverlay" class="absolute inset-0 bg-panel/90 backdrop-blur z-10 flex flex-col items-center justify-center rounded-lg">
        <span class="text-4xl mb-2">🔒</span><p class="text-indigo-300 font-bold mb-3">請登入系統進行異動</p>
        <button onclick="toggleLogin()" class="px-4 py-2 bg-indigo-600 rounded text-white text-xs font-bold shadow">前往登入</button>
      </div>

      <h2 class="text-sm font-semibold text-sky-400 mb-3">📦 庫存異動與溯源登記</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">異動類型 *</label>
          <select id="transType" onchange="toggleTransFields()" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
            <option value="IN">基地收穫 / 產品入庫 (+)</option>
            <option value="OUT">門市調撥 / 發貨出庫 (-)</option>
            <option value="NEW">新產品建檔 (含溯源資料)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">產品品號 *</label>
          <input type="text" id="partNo" placeholder="如 MOXA-01" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 uppercase font-mono">
        </div>

        <div id="newSkuFields" class="hidden space-y-2 border-l-2 border-sky-500 pl-2">
          <input type="text" id="partName" placeholder="產品品名規格" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">所屬自定義類別</label>
            <select id="partCategory" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="unitPrice" placeholder="單價 (¥)" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200">
            <input type="number" id="safetyStock" placeholder="安全水位" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200">
          </div>
          <!-- 升級: 溯源詳情欄位 -->
          <div>
            <textarea id="partDesc" placeholder="前台溯源與商品詳情描述 (選填，無填寫將由前台根據分類自動產生)" rows="3" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 leading-relaxed"></textarea>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="transQty" placeholder="數量 *" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
          <input type="text" id="binLocation" placeholder="乾燥儲位" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 uppercase">
        </div>
        <button onclick="executeTransaction()" class="w-full mt-2 py-2.5 rounded bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold text-xs transition">💾 提交異動</button>
      </div>
    </div>

    <!-- 右側：資料視圖切換 -->
    <div class="lg:col-span-8 bg-panel border border-theme rounded-lg p-4">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2 mb-4">
        <input type="text" id="searchKwd" oninput="renderViews()" placeholder="🔍 搜尋品號、品名..." class="bg-sub border border-theme rounded px-3 py-1.5 text-xs text-slate-200 flex-1">
        <div class="flex gap-2 overflow-x-auto whitespace-nowrap">
          <button onclick="switchView('table')" id="btnTabTable" class="px-3 py-1.5 rounded text-xs bg-sky-500 text-slate-900 font-semibold">產品台帳</button>
          <button onclick="switchView('categories')" id="btnTabCategories" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">🗂️ 菜單分類</button>
          <button onclick="switchView('orders')" id="btnTabOrders" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">📦 發貨訂單</button>
          <button onclick="switchView('logs')" id="btnTabLogs" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">📖 操作日誌</button>
        </div>
      </div>

      <!-- 視圖 1：台帳列表 -->
      <div id="viewTable" class="overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[700px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr>
              <th class="p-2.5 w-16 text-center">圖片</th>
              <th class="p-2.5">品號 / 品名</th>
              <th class="p-2.5">分類 / 溯源狀態</th>
              <th class="p-2.5">庫存 / 儲位</th>
              <th class="p-2.5">單價 (總值)</th>
              <th class="p-2.5">圖片管理</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>

      <!-- 其他視圖區塊保持不變 -->
      <div id="viewCategories" class="hidden space-y-4">
        <div class="bg-sub border border-theme rounded-lg p-3">
          <h3 class="text-xs font-bold text-sky-400 mb-2">➕ 新增自定義類別</h3>
          <div class="flex gap-2">
            <input type="text" id="newCategoryName" placeholder="輸入新分類名稱" class="flex-1 bg-panel border border-theme rounded px-3 py-1.5 text-xs text-slate-200 outline-none">
            <button onclick="addCategory()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-bold text-white transition">確認新增</button>
          </div>
        </div>
        <div class="border border-theme rounded overflow-hidden">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-900 text-slate-400 border-b border-theme">
              <tr><th class="p-2.5">排序/ID</th><th class="p-2.5">前台菜單類別名稱</th><th class="p-2.5">當前納管產品數</th><th class="p-2.5 text-right">操作</th></tr>
            </thead>
            <tbody id="categoryTableBody" class="divide-y divide-theme"></tbody>
          </table>
        </div>
      </div>

      <div id="viewOrders" class="hidden overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[800px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr><th class="p-2.5">訂單號 / 時間</th><th class="p-2.5">收件資訊</th><th class="p-2.5">品項明細</th><th class="p-2.5">金額</th><th class="p-2.5">發貨狀態</th></tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>

      <div id="viewLogs" class="hidden overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[600px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr><th class="p-2.5">時間</th><th class="p-2.5">操作者</th><th class="p-2.5">品號 / 項目</th><th class="p-2.5">動作</th><th class="p-2.5">數量</th></tr>
          </thead>
          <tbody id="logsTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<input type="file" id="imageUploader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

<div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
  <div class="bg-panel border border-theme rounded-lg p-5 max-w-sm w-full space-y-3">
    <h3 class="font-bold text-indigo-400 text-center">🔐 系統登入</h3>
    <input type="email" id="authEmail" placeholder="Email" class="w-full bg-sub border border-theme rounded p-2 text-slate-200 text-xs outline-none">
    <input type="password" id="authPassword" placeholder="Password" onkeydown="if(event.key==='Enter') performLogin()" class="w-full bg-sub border border-theme rounded p-2 text-slate-200 text-xs outline-none">
    <div class="flex gap-2">
      <button onclick="closeAuthModal()" class="flex-1 py-1.5 rounded text-xs bg-slate-800 hover:bg-slate-700 transition">取消</button>
      <button onclick="performLogin()" class="flex-1 py-1.5 rounded text-xs bg-indigo-600 hover:bg-indigo-500 font-bold transition">登入</button>
    </div>
  </div>
</div>

<script>
  const FIXED_SUPABASE_URL = "https://xayagdicjwexwtehdjby.supabase.co";
  const FIXED_SUPABASE_KEY = "sb_publishable_ehe3Q13ZWq3552zzWQmGvg_2RnhkJIV";

  let supabaseClient = supabase.createClient(FIXED_SUPABASE_URL, FIXED_SUPABASE_KEY);
  let inventoryList = [];
  let categoryList = [];
  let currentTab = 'table';
  let currentUser = null;
  let targetPartNoForUpload = null;
  let idleTimer = null;

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentUser = session ? session.user : null;
    document.getElementById('authOverlay').classList.toggle('hidden', !!currentUser);
    document.getElementById('userEmailLabel').innerText = currentUser ? `👤 ${escapeHtml(currentUser.email)}` : '未登入';
    document.getElementById('btnLoginOut').innerText = currentUser ? '登出' : '登入';
    if (currentUser) { resetIdleTimer(); fetchAllData(); if (currentTab === 'orders') fetchShopOrders(); } 
    else if (idleTimer) clearTimeout(idleTimer);
  });
  
  function toggleLogin() { currentUser ? supabaseClient.auth.signOut() : document.getElementById('authModal').classList.replace('hidden', 'flex'); }
  function closeAuthModal() { document.getElementById('authModal').classList.replace('flex', 'hidden'); }
  
  async function performLogin() {
    const emailVal = document.getElementById('authEmail').value.trim(), passVal = document.getElementById('authPassword').value;
    if (!emailVal || !passVal) return alert("請輸入 Email 與密碼！");
    const { error } = await supabaseClient.auth.signInWithPassword({ email: emailVal, password: passVal });
    if (error) alert("登入失敗：" + error.message); else { closeAuthModal(); resetIdleTimer(); }
  }

  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    if (currentUser) idleTimer = setTimeout(() => { supabaseClient.auth.signOut(); alert("已自動登出！"); location.reload(); }, 15 * 60 * 1000);
  }
  ['mousemove', 'keydown', 'touchstart', 'scroll'].forEach(evt => window.addEventListener(evt, resetIdleTimer, false));

  async function fetchAllData() { await fetchCategories(); await fetchProducts(); }
  
  async function fetchCategories() {
    const { data, error } = await supabaseClient.from('product_categories').select('*').order('sort_order', { ascending: true }).order('id', { ascending: true });
    categoryList = data || [];
    document.getElementById('kpiCategoryTotal').innerText = categoryList.length;
    const select = document.getElementById('partCategory');
    select.innerHTML = categoryList.length === 0 ? '<option value="未分類">未分類</option>' : categoryList.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
    renderCategoriesTable();
  }

  async function fetchProducts() {
    const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
    inventoryList = data || [];
    renderViews();
  }

  function renderCategoriesTable() {
    document.getElementById('categoryTableBody').innerHTML = categoryList.map(c => `
      <tr class="hover:bg-slate-800/40">
        <td class="p-2.5 font-mono text-slate-400">#${Number(c.id)}</td>
        <td class="p-2.5 font-bold text-emerald-400">${escapeHtml(c.name)}</td>
        <td class="p-2.5 text-slate-300">${inventoryList.filter(i => i.category === c.name).length} 件商品</td>
        <td class="p-2.5 text-right"><button onclick="deleteCategory(${Number(c.id)})" class="px-2 py-1 bg-rose-600/20 text-rose-400 hover:bg-rose-600/40 rounded text-xs transition">刪除</button></td>
      </tr>`).join('');
  }

  async function addCategory() {
    if (!currentUser) return alert("請先登入後台！");
    const name = document.getElementById('newCategoryName').value.trim();
    if (!name || categoryList.some(c => c.name === name)) return alert(name ? "該分類已存在！" : "請輸入類別名稱！");
    const { error } = await supabaseClient.from('product_categories').insert([{ name }]);
    if (error) alert("新增失敗: " + error.message); else { document.getElementById('newCategoryName').value = ''; await fetchCategories(); }
  }

  async function deleteCategory(id) {
    if (!currentUser) return alert("請先登入！");
    const cat = categoryList.find(c => c.id === id), catName = cat ? cat.name : `ID #${id}`;
    const count = inventoryList.filter(i => i.category === (cat ? cat.name : '')).length;
    if (count > 0 && !confirm(`類別「${catName}」下有 ${count} 件商品，確定刪除嗎？`)) return;
    else if (count === 0 && !confirm(`確定刪除類別「${catName}」？`)) return;
    const { error } = await supabaseClient.from('product_categories').delete().eq('id', id);
    if (!error) await fetchCategories();
  }

  function renderViews() {
    const kwd = document.getElementById('searchKwd').value.toLowerCase();
    let totalVal = 0, lowCount = 0, zeroCount = 0;
    inventoryList.forEach(i => { totalVal += (i.stock || 0) * (i.unit_price || 0); if (i.stock === 0) zeroCount++; else if (i.stock <= i.safety_stock) lowCount++; });
    document.getElementById('kpiSkuTotal').innerText = inventoryList.length; document.getElementById('kpiTotalValue').innerText = `¥${totalVal.toLocaleString()}`; document.getElementById('kpiZeroStock').innerText = zeroCount;

    document.getElementById('inventoryTableBody').innerHTML = inventoryList.filter(i => (i.part_no||'').toLowerCase().includes(kwd) || (i.part_name||'').toLowerCase().includes(kwd) || (i.category||'').toLowerCase().includes(kwd)).map(i => {
      const hasDesc = i.description && i.description.trim() !== '';
      return `
        <tr class="hover:bg-slate-800/40">
          <td class="p-2.5 flex justify-center">${i.image_url ? `<img src="${escapeHtml(i.image_url)}" class="w-10 h-10 object-cover rounded shadow border border-slate-700">` : `<div class="w-10 h-10 bg-slate-800 rounded flex items-center justify-center text-[10px] text-slate-500">無圖</div>`}</td>
          <td class="p-2.5 leading-tight"><span class="font-mono text-sky-400 font-bold">${escapeHtml(i.part_no)}</span><br><span class="text-[11px] text-slate-300">${escapeHtml(i.part_name)}</span></td>
          <td class="p-2.5">
            <span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 border border-theme text-emerald-400 font-medium">${escapeHtml(i.category || '未分類')}</span>
            ${hasDesc ? '<span class="ml-1 text-[10px] text-amber-300">📜 具溯源履歷</span>' : ''}
          </td>
          <td class="p-2.5 leading-tight"><span class="${i.stock===0?'text-rose-400':'text-emerald-400'} font-bold">${i.stock} ${escapeHtml(i.unit||'件')}</span><br><span class="font-mono text-amber-300 text-[10px]">儲位: ${escapeHtml(i.bin_location || '')}</span></td>
          <td class="p-2.5 leading-tight">¥${i.unit_price}<br><span class="text-slate-500 text-[10px]">總額 ¥${(i.stock * i.unit_price)}</span></td>
          <td class="p-2.5"><button onclick="triggerImageUpload('${encodeURIComponent(i.part_no)}')" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded text-xs text-white transition flex items-center gap-1">📷 換圖</button></td>
        </tr>`;
    }).join('');
  }

  function triggerImageUpload(encodedPartNo) { if (!currentUser) return alert("請登入！"); targetPartNoForUpload = decodeURIComponent(encodedPartNo); document.getElementById('imageUploader').click(); }
  async function handleImageUpload(event) {
    const file = event.target.files[0]; if (!file || !targetPartNoForUpload) return;
    if (file.size > 2 * 1024 * 1024) return alert("圖片太大！請選擇 2MB 以下。");
    try {
      const filePath = `images/${targetPartNoForUpload}_${Date.now()}.${file.name.split('.').pop()}`;
      const { error: upErr } = await supabaseClient.storage.from('product-images').upload(filePath, file); if (upErr) throw upErr;
      const { data: pData } = supabaseClient.storage.from('product-images').getPublicUrl(filePath);
      const { error: dbErr } = await supabaseClient.from('products').update({ image_url: pData.publicUrl }).eq('part_no', targetPartNoForUpload); if (dbErr) throw dbErr;
      alert("圖片更新成功！"); await fetchProducts();
    } catch (err) { alert("上傳失敗: " + err.message); } finally { document.getElementById('imageUploader').value = ''; targetPartNoForUpload = null; }
  }

  async function fetchShopOrders() {
    const { data } = await supabaseClient.from('shop_orders').select('*').order('created_at', { ascending: false });
    let pendingCount = 0;
    document.getElementById('ordersTableBody').innerHTML = (data || []).map(o => {
      const isShipped = o.order_status === 'SHIPPED' || o.shipping_status === '已發貨'; if (!isShipped) pendingCount++;
      let itemsHtml = ''; try { const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items; itemsHtml = (items||[]).map(i => `${escapeHtml(i.part_name)} x${i.quantity||i.qty||1}`).join('<br>'); } catch(e){}
      return `<tr class="hover:bg-slate-800/40"><td class="p-2.5 text-[11px] font-mono text-slate-400"><span class="text-sky-400 font-bold">${escapeHtml(o.order_no||o.id)}</span><br>${new Date(o.created_at).toLocaleString('zh-TW',{hour12:false})}</td><td class="p-2.5 leading-tight"><strong class="text-white">${escapeHtml(o.recipient_name||o.customer_name)}</strong><br><span class="text-slate-400 text-[10px]">${escapeHtml(o.shipping_address||'')}</span></td><td class="p-2.5 text-[10px] text-slate-300">${itemsHtml}</td><td class="p-2.5 font-bold text-emerald-400">¥${Number(o.total_amount||0)}</td><td class="p-2.5">${isShipped ? `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-900 text-emerald-400">已出貨</span>` : `<button onclick="shipOrder(${Number(o.id)})" class="px-2.5 py-1 bg-sky-600 rounded text-xs text-white">點擊發貨</button>`}</td></tr>`;
    }).join('');
    document.getElementById('kpiPendingOrder').innerText = pendingCount;
  }

  async function shipOrder(orderId) {
    if (!currentUser) return alert("請先登入！"); const track = prompt("請填寫快遞單號 (可選填)："); if (track === null) return;
    try { const { error } = await supabaseClient.from('shop_orders').update({ order_status: 'SHIPPED', shipping_status: '已發貨', tracking_no: track.trim() }).eq('id', orderId); if (error) throw error; alert("發貨成功！"); await fetchShopOrders(); } catch (err) { alert("更新失敗：" + err.message); }
  }

  function switchView(tab) {
    currentTab = tab;
    ['table', 'categories', 'orders', 'logs'].forEach(t => {
      document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).className = tab === t ? 'block' : 'hidden';
      document.getElementById('btnTab' + t.charAt(0).toUpperCase() + t.slice(1)).className = tab === t ? 'px-3 py-1.5 rounded text-xs bg-sky-500 text-slate-900 font-semibold' : 'px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme';
    });
    if (tab === 'categories') renderCategoriesTable(); if (tab === 'orders') fetchShopOrders();
    if (tab === 'logs') supabaseClient.from('inventory_transactions').select('*').order('created_at', { ascending: false }).limit(50).then(({ data }) => document.getElementById('logsTableBody').innerHTML = (data || []).map(l => `<tr class="hover:bg-slate-800/40"><td class="p-2.5 text-slate-400 text-[11px]">${new Date(l.created_at).toLocaleString()}</td><td class="p-2.5 text-indigo-300 text-[11px]">${escapeHtml(l.operator||'系統')}</td><td class="p-2.5 font-mono text-sky-400 text-xs">${escapeHtml(l.part_no||'')}</td><td class="p-2.5 text-xs text-emerald-400">${escapeHtml(l.trans_type||l.change_type)}</td><td class="p-2.5 font-bold">${Number(l.qty||l.change_amount||0)}</td></tr>`).join(''));
  }

  function toggleTransFields() { document.getElementById('newSkuFields').className = document.getElementById('transType').value === 'NEW' ? 'space-y-2 border-l-2 border-sky-500 pl-2' : 'hidden'; }
  
  async function executeTransaction() {
    if (!currentUser) return alert("無權限！請先登入");
    const t = document.getElementById('transType').value, p = document.getElementById('partNo').value.toUpperCase().trim(), q = parseInt(document.getElementById('transQty').value), b = document.getElementById('binLocation').value.toUpperCase().trim();
    if (!p || isNaN(q) || q <= 0) return alert("數量必須大於 0 且品號不能為空！");
    const i = inventoryList.find(x => x.part_no === p); if (t === 'NEW' && i) return alert("該品號已存在！"); if (t !== 'NEW' && !i) return alert("品號不存在！");
    
    try {
      let res;
      if (t === 'NEW') {
        res = await supabaseClient.from('products').insert([{
          part_no: p, part_name: document.getElementById('partName').value.trim(), category: document.getElementById('partCategory').value,
          stock: q, bin_location: b, unit_price: parseFloat(document.getElementById('unitPrice').value) || 0, safety_stock: parseInt(document.getElementById('safetyStock').value) || 0,
          description: document.getElementById('partDesc').value.trim()
        }]);
      } else if (t === 'IN') { res = await supabaseClient.from('products').update({ stock: i.stock + q, bin_location: b || i.bin_location }).eq('part_no', p);
      } else if (t === 'OUT') { if (i.stock < q) return alert("庫存不足！"); res = await supabaseClient.from('products').update({ stock: i.stock - q }).eq('part_no', p); }
      if (res && res.error) throw res.error;
      await supabaseClient.from('inventory_transactions').insert([{ part_no: p, trans_type: t, qty: q, bin_location: b, operator: currentUser.email }]);
      document.getElementById('transQty').value = ''; await fetchProducts(); alert("庫存與溯源異動更新成功！");
    } catch (err) { alert("更新失敗：" + err.message); }
  }

  function exportCSV() {
    let csv = "\uFEFF品號,品名規格,類別,儲位,現存量,單價,總值\n";
    inventoryList.forEach(i => csv += `"${i.part_no}","${i.part_name}","${i.category}","${i.bin_location}",${i.stock},${i.unit_price},${(i.stock||0)*(i.unit_price||0)}\n`);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); a.download = `艾產品台帳.csv`; a.click();
  }
  fetchAllData();
</script>

  'use strict';

  setInterval(() => { try { const s = performance.now(); debugger; if (performance.now() - s > 100) { if (devToolsDetected) return; devToolsDetected = true; document.body.innerHTML = '<div style="color:white;text-align:center;padding:50px;">安全防護觸發，已終止。</div>'; } } catch(e){} }, 800);
})();
</script>
