<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
    style-src 'self' 'unsafe-inline' https:;
    connect-src 'self' https://xayagdicjwexwtehdjby.supabase.co wss://xayagdicjwexwtehdjby.supabase.co https://api.qrserver.com;
    img-src 'self' data: https: blob:;
    font-src 'self' data: https:;
  ">
  <title>艾產品管理系統 - 分類防誤刪與商品備註清退版</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>

  <style>
    body { 
      background-color: #0a0f1d; 
      color: #f8fafc; 
      -webkit-tap-highlight-color: transparent; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    input, textarea, select, td, th { 
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }
    .bg-panel { background-color: #141e33; }
    .bg-sub { background-color: #0d1527; }
    .border-theme { border-color: #223254; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    
    .status-inactive {
      opacity: 0.5;
      filter: grayscale(80%);
    }
  </style>
</head>
<body class="p-3 md:p-6 text-sm">

<div class="max-w-7xl mx-auto flex flex-col gap-4">
  
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-theme gap-3">
    <div>
      <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 text-white">
        🌿 艾產品管理系統
        <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-900 text-indigo-300 font-normal">分類約束與商品清退版</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">即時同步前台菜單、發貨、圖庫與庫存中台</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
      <div id="accountStatus" class="flex items-center gap-2 mr-2 border-r border-theme pr-4">
         <span id="userEmailLabel" class="text-xs text-slate-400">未登入</span>
         <button id="btnLoginOut" onclick="toggleLogin()" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-xs text-white font-bold">登入</button>
      </div>
      <button onclick="exportCSV()" class="px-3 py-1.5 rounded bg-sky-500 text-slate-900 font-bold text-xs">📤 匯出台帳</button>
    </div>
  </header>

  <!-- 戰情看板 -->
  <div class="grid grid-cols-2 md:grid-cols-5 gap-2.5">
    <div class="bg-panel border border-theme rounded-lg p-3">
      <div class="text-xs text-slate-400">納管品項 (SKUs)</div>
      <div class="text-xl font-bold text-sky-400 mt-1" id="kpiSkuTotal">0</div>
    </div>
    <div class="bg-panel border border-theme rounded-lg p-3">
      <div class="text-xs text-slate-400">庫存總值 (RMB)</div>
      <div class="text-xl font-bold text-white mt-1" id="kpiTotalValue">¥0</div>
    </div>
    <div class="bg-panel border border-theme rounded-lg p-3">
      <div class="text-xs text-slate-400">待發貨訂單</div>
      <div class="text-xl font-bold text-indigo-400 mt-1" id="kpiPendingOrder">0</div>
    </div>
    <div class="bg-panel border border-theme rounded-lg p-3">
      <div class="text-xs text-slate-400">有效自定義類別</div>
      <div class="text-xl font-bold text-emerald-400 mt-1" id="kpiCategoryTotal">0</div>
    </div>
    <div class="bg-panel border border-theme rounded-lg p-3 col-span-2 md:col-span-1">
      <div class="text-xs text-slate-400">零庫存斷貨品項</div>
      <div class="text-xl font-bold text-rose-500 mt-1" id="kpiZeroStock">0</div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
    
    <!-- 左側：異動登記 -->
    <div class="lg:col-span-4 bg-panel border border-theme rounded-lg p-4 relative">
      <div id="authOverlay" class="absolute inset-0 bg-panel/90 backdrop-blur z-10 flex flex-col items-center justify-center rounded-lg">
        <span class="text-4xl mb-2">🔒</span>
        <p class="text-indigo-300 font-bold mb-3">請登入系統進行異動</p>
        <button onclick="toggleLogin()" class="px-4 py-2 bg-indigo-600 rounded text-white text-xs font-bold shadow">前往登入</button>
      </div>

      <h2 class="text-sm font-semibold text-sky-400 mb-3">📦 庫存異動與溯源登記</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">異動類型 *</label>
          <select id="transType" onchange="toggleTransFields()" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
            <option value="IN">基地收穫 / 產品入庫 (+)</option>
            <option value="OUT">門市調撥 / 發貨出庫 (-)</option>
            <option value="NEW">新產品建檔 (含溯源資料)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">產品品號 *</label>
          <input type="text" id="partNo" placeholder="如 MOXA-01" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 uppercase font-mono">
        </div>

        <div id="newSkuFields" class="hidden space-y-2 border-l-2 border-sky-500 pl-2">
          <input type="text" id="partName" placeholder="產品品名規格" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">所屬自定義類別</label>
            <select id="partCategory" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200"></select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="number" id="unitPrice" placeholder="單價 (¥)" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200">
            <input type="number" id="safetyStock" placeholder="安全水位" class="w-full bg-sub border border-theme rounded px-2 py-1.5 text-xs text-slate-200">
          </div>
          <div>
            <textarea id="partDesc" placeholder="前台溯源與商品詳情描述 (選填，若留空前台將根據分類自動帶入官方道地履歷)" rows="3" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 leading-relaxed"></textarea>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="transQty" placeholder="數量 *" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200">
          <input type="text" id="binLocation" placeholder="乾燥儲位" class="w-full bg-sub border border-theme rounded px-2.5 py-1.5 text-xs text-slate-200 uppercase">
        </div>
        <button onclick="executeTransaction()" class="w-full mt-2 py-2.5 rounded bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold text-xs transition">💾 提交異動</button>
      </div>
    </div>

    <!-- 右側：資料視圖切換 -->
    <div class="lg:col-span-8 bg-panel border border-theme rounded-lg p-4">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2 mb-4">
        <input type="text" id="searchKwd" oninput="renderViews()" placeholder="🔍 搜尋品號、品名..." class="bg-sub border border-theme rounded px-3 py-1.5 text-xs text-slate-200 flex-1">
        
        <div class="flex gap-2 overflow-x-auto whitespace-nowrap">
          <button onclick="switchView('table')" id="btnTabTable" class="px-3 py-1.5 rounded text-xs bg-sky-500 text-slate-900 font-semibold">產品台帳</button>
          <button onclick="switchView('categories')" id="btnTabCategories" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">🗂️ 菜單分類管理</button>
          <button onclick="switchView('orders')" id="btnTabOrders" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">📦 發貨訂單</button>
          <button onclick="switchView('logs')" id="btnTabLogs" class="px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme">📖 操作日誌</button>
        </div>
      </div>

      <!-- 視圖 1：台帳列表 -->
      <div id="viewTable" class="overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[780px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr>
              <th class="p-2.5 w-16 text-center">圖片</th>
              <th class="p-2.5">品號 / 品名</th>
              <th class="p-2.5">分類 / 狀態</th>
              <th class="p-2.5">庫存 / 儲位</th>
              <th class="p-2.5">單價 (總值)</th>
              <th class="p-2.5 text-center w-36">操作管理</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>

      <!-- 視圖 2：分類管理 -->
      <div id="viewCategories" class="hidden space-y-4">
        <div class="bg-sub border border-theme rounded-lg p-3">
          <h3 class="text-xs font-bold text-sky-400 mb-2">➕ 新增自定義類別 (將即時顯示在前台頂部菜單)</h3>
          <div class="flex gap-2">
            <input type="text" id="newCategoryName" placeholder="輸入新分類名稱 (如：薰香養生、特級艾絨條)" class="flex-1 bg-panel border border-theme rounded px-3 py-1.5 text-xs text-slate-200 outline-none">
            <button onclick="addCategory()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded text-xs font-bold text-white transition">確認新增</button>
          </div>
        </div>

        <div class="border border-theme rounded overflow-hidden">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-900 text-slate-400 border-b border-theme">
              <tr>
                <th class="p-2.5">排序/ID</th>
                <th class="p-2.5">前台菜單類別名稱</th>
                <th class="p-2.5">當前納管產品數</th>
                <th class="p-2.5 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody" class="divide-y divide-theme"></tbody>
          </table>
        </div>
      </div>

      <!-- 視圖 3：發貨管理 -->
      <div id="viewOrders" class="hidden overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[800px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr>
              <th class="p-2.5">訂單號 / 時間</th>
              <th class="p-2.5">收件資訊</th>
              <th class="p-2.5">品項明細</th>
              <th class="p-2.5">金額</th>
              <th class="p-2.5">發貨狀態</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>

      <!-- 視圖 4：日誌 -->
      <div id="viewLogs" class="hidden overflow-x-auto border border-theme rounded">
        <table class="w-full text-left text-xs min-w-[650px]">
          <thead class="bg-slate-900 text-slate-400 border-b border-theme">
            <tr>
              <th class="p-2.5">時間</th>
              <th class="p-2.5">操作者</th>
              <th class="p-2.5">品號 / 項目</th>
              <th class="p-2.5">動作</th>
              <th class="p-2.5">數量 / 備註詳情</th>
            </tr>
          </thead>
          <tbody id="logsTableBody" class="divide-y divide-theme"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<input type="file" id="imageUploader" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

<!-- 登入視窗 -->
<div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
  <div class="bg-panel border border-theme rounded-lg p-5 max-w-sm w-full space-y-3">
    <h3 class="font-bold text-indigo-400 text-center">🔐 系統登入</h3>
    <input type="email" id="authEmail" placeholder="Email" class="w-full bg-sub border border-theme rounded p-2 text-slate-200 text-xs outline-none">
    <input type="password" id="authPassword" placeholder="Password" onkeydown="if(event.key==='Enter') performLogin()" class="w-full bg-sub border border-theme rounded p-2 text-slate-200 text-xs outline-none">
    <div class="flex gap-2">
      <button onclick="closeAuthModal()" class="flex-1 py-1.5 rounded text-xs bg-slate-800 hover:bg-slate-700 transition">取消</button>
      <button onclick="performLogin()" class="flex-1 py-1.5 rounded text-xs bg-indigo-600 hover:bg-indigo-500 font-bold transition">登入</button>
    </div>
  </div>
</div>

<script>
  const FIXED_SUPABASE_URL = "https://xayagdicjwexwtehdjby.supabase.co";
  const FIXED_SUPABASE_KEY = "sb_publishable_ehe3Q13ZWq3552zzWQmGvg_2RnhkJIV";

  let supabaseClient = supabase.createClient(FIXED_SUPABASE_URL, FIXED_SUPABASE_KEY);
  let inventoryList = [];
  let categoryList = [];
  let currentTab = 'table';
  let currentUser = null;
  let targetPartNoForUpload = null;
  let idleTimer = null;

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentUser = session ? session.user : null;
    document.getElementById('authOverlay').classList.toggle('hidden', !!currentUser);
    document.getElementById('userEmailLabel').innerText = currentUser ? `👤 ${escapeHtml(currentUser.email)}` : '未登入';
    document.getElementById('btnLoginOut').innerText = currentUser ? '登出' : '登入';
    
    if (currentUser) {
      resetIdleTimer();
      fetchAllData();
      if (currentTab === 'orders') fetchShopOrders();
    } else if (idleTimer) {
      clearTimeout(idleTimer);
    }
  });
  
  function toggleLogin() { 
    currentUser ? supabaseClient.auth.signOut() : document.getElementById('authModal').classList.replace('hidden', 'flex'); 
  }
  
  function closeAuthModal() { 
    document.getElementById('authModal').classList.replace('flex', 'hidden'); 
  }
  
  async function performLogin() {
    const emailVal = document.getElementById('authEmail').value.trim();
    const passVal = document.getElementById('authPassword').value;
    if (!emailVal || !passVal) return alert("請輸入 Email 與密碼！");

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: emailVal,
      password: passVal
    });
    if (error) {
      alert("登入失敗：" + error.message);
    } else {
      closeAuthModal();
      resetIdleTimer();
    }
  }

  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    if (currentUser) {
      idleTimer = setTimeout(() => {
        supabaseClient.auth.signOut();
        alert("為確保設備與後台安全，系統因閒置超過 15 分鐘已自動登出！");
        location.reload();
      }, 15 * 60 * 1000);
    }
  }

  ['mousemove', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
    window.addEventListener(evt, resetIdleTimer, false);
  });

  async function fetchAllData() {
    await fetchCategories();
    await fetchProducts();
  }

  async function fetchCategories() {
    const { data, error } = await supabaseClient
      .from('product_categories')
      .select('*')
      .order('sort_order', { ascending: true })
      .order('id', { ascending: true });
      
    if (error) console.error("獲取分類失敗:", error.message);
    categoryList = data || [];
    document.getElementById('kpiCategoryTotal').innerText = categoryList.length;

    const select = document.getElementById('partCategory');
    if (categoryList.length === 0) {
      select.innerHTML = '<option value="未分類">未分類</option>';
    } else {
      select.innerHTML = categoryList.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
    }
    renderCategoriesTable();
  }

  async function fetchProducts() {
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });
      
    if (error) console.error("獲取商品失敗:", error.message);
    inventoryList = data || [];
    renderViews();
  }

  function renderCategoriesTable() {
    const tbody = document.getElementById('categoryTableBody');
    tbody.innerHTML = categoryList.map(c => {
      const count = inventoryList.filter(i => i.category === c.name).length;
      return `
        <tr class="hover:bg-slate-800/40">
          <td class="p-2.5 font-mono text-slate-400">#${Number(c.id)}</td>
          <td class="p-2.5 font-bold text-emerald-400">${escapeHtml(c.name)}</td>
          <td class="p-2.5 text-slate-300">
            <span class="${count > 0 ? 'text-amber-300' : 'text-slate-400'} font-medium">${count} 件商品</span>
          </td>
          <td class="p-2.5 text-right space-x-1.5">
            <button onclick="editCategory(${Number(c.id)})" class="px-2.5 py-1 bg-amber-600/20 text-amber-300 hover:bg-amber-600/40 rounded text-xs transition">修改名稱</button>
            <button onclick="deleteCategory(${Number(c.id)})" class="px-2.5 py-1 ${count > 0 ? 'bg-slate-700/50 text-slate-500 cursor-not-allowed' : 'bg-rose-600/20 text-rose-400 hover:bg-rose-600/40'} rounded text-xs transition">刪除</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function addCategory() {
    if (!currentUser) return alert("請先登入後台！");
    const name = document.getElementById('newCategoryName').value.trim();
    if (!name) return alert("請輸入類別名稱！");

    const exists = categoryList.some(c => c.name === name);
    if (exists) return alert("該分類已存在！");

    const { error } = await supabaseClient.from('product_categories').insert([{ name }]);
    if (error) {
      alert("新增失敗: " + error.message);
    } else {
      document.getElementById('newCategoryName').value = '';
      await fetchCategories();
      alert(`分類「${name}」已新增，前台選單已同步！`);
    }
  }

  async function editCategory(id) {
    if (!currentUser) return alert("請先登入！");
    const cat = categoryList.find(c => c.id === id);
    if (!cat) return;

    const oldName = cat.name;
    const newName = prompt(`請輸入新的分類名稱（原名稱：${oldName}）：`, oldName);
    if (newName === null) return;

    const trimmed = newName.trim();
    if (!trimmed) return alert("分類名稱不能為空！");
    if (trimmed === oldName) return;

    const exists = categoryList.some(c => c.name === trimmed && c.id !== id);
    if (exists) return alert("該分類名稱已存在！");

    try {
      const { error: catErr } = await supabaseClient
        .from('product_categories')
        .update({ name: trimmed })
        .eq('id', id);
      if (catErr) throw catErr;

      const { error: prodErr } = await supabaseClient
        .from('products')
        .update({ category: trimmed })
        .eq('category', oldName);
      if (prodErr) console.warn("同步更新商品分類提示:", prodErr.message);

      alert(`分類名稱已成功更新為「${trimmed}」，關聯商品與前台菜單已同步！`);
      await fetchAllData();
    } catch (err) {
      alert("修改分類失敗：" + err.message);
    }
  }

  /* 規則 1：產品類別可被刪除的前提是其下沒有產品 */
  async function deleteCategory(id) {
    if (!currentUser) return alert("請先登入！");
    const cat = categoryList.find(c => c.id === id);
    if (!cat) return;
    const catName = cat.name;
    const count = inventoryList.filter(i => i.category === catName).length;

    // 前置約束：類別下仍有商品，一律禁止刪除
    if (count > 0) {
      alert(`【無法刪除】類別「${catName}」下目前仍納管有 ${count} 件商品！\n\n依安全規則：分類下無任何商品時方可刪除。\n請先前往「產品台帳」將關聯商品刪除或將其分類移至其他類別後再試。`);
      return;
    }

    if (!confirm(`確定要刪除空類別「${catName}」嗎？此操作不可還原。`)) return;

    const { error } = await supabaseClient.from('product_categories').delete().eq('id', id);
    if (error) {
      alert("刪除失敗: " + error.message);
    } else {
      alert(`類別「${catName}」已成功刪除！`);
      await fetchCategories();
    }
  }

  // 上下架狀態切換
  async function toggleProductStatus(partNo, currentStatus) {
    if (!currentUser) return alert("請先登入系統！");
    const activeStat = currentStatus === 'INACTIVE' ? 'INACTIVE' : 'ACTIVE';
    const newStatus = activeStat === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
    const actionText = newStatus === 'ACTIVE' ? '重新上架' : '下架隱藏';

    if (!confirm(`確定要將商品 ${partNo} 設為「${actionText}」嗎？\n(下架後前台將不再展示該商品)`)) return;

    try {
      const { error } = await supabaseClient
        .from('products')
        .update({ status: newStatus })
        .eq('part_no', partNo);

      if (error) throw error;
      alert(`商品已成功${actionText}！`);
      await fetchProducts();
    } catch (err) {
      alert(`狀態更新失敗：${err.message}`);
    }
  }

  /* 規則 2：產品可以被刪除，且必須填寫備註原因 */
  async function deleteProduct(partNo) {
    if (!currentUser) return alert("請先登入系統！");
    const prod = inventoryList.find(x => x.part_no === partNo);
    if (!prod) return alert("找不到指定商品！");

    const reason = prompt(`【警告】即將永久刪除商品：\n品名：${prod.part_name} (${partNo})\n當前剩餘庫存：${prod.stock} 件\n\n請輸入刪除/報廢備註原因（必填）：`);
    if (reason === null) return; // 點擊取消

    const cleanReason = reason.trim();
    if (!cleanReason) {
      return alert("刪除失敗：依管理規定，必須填寫刪除備註原因！");
    }

    if (!confirm(`最後確認：確定要永久刪除【${prod.part_name}】嗎？\n填寫備註：${cleanReason}`)) return;

    try {
      // 1. 從 products 資料表移除
      const { error: delErr } = await supabaseClient
        .from('products')
        .delete()
        .eq('part_no', partNo);

      if (delErr) throw delErr;

      // 2. 寫入審計與操作日誌，備註存於 bin_location 欄位備查
      const { error: logErr } = await supabaseClient
        .from('inventory_transactions')
        .insert([{
          part_no: partNo,
          trans_type: 'DELETE',
          qty: prod.stock || 0,
          bin_location: '【刪除備註】' + cleanReason,
          operator: currentUser.email
        }]);
      if (logErr) console.warn("日誌記錄提示:", logErr.message);

      alert(`商品「${prod.part_name}」已成功自系統刪除，並已登記備註日誌！`);
      await fetchProducts();
    } catch (err) {
      alert("刪除商品失敗: " + err.message);
    }
  }

  function renderViews() {
    const kwd = document.getElementById('searchKwd').value.toLowerCase();
    
    let totalVal = 0, lowCount = 0, zeroCount = 0;
    inventoryList.forEach(i => { 
      totalVal += (i.stock || 0) * (i.unit_price || 0); 
      if (i.stock === 0) zeroCount++; 
      else if (i.stock <= i.safety_stock) lowCount++; 
    });
    document.getElementById('kpiSkuTotal').innerText = inventoryList.length;
    document.getElementById('kpiTotalValue').innerText = `¥${totalVal.toLocaleString()}`;
    document.getElementById('kpiZeroStock').innerText = zeroCount;

    const tbody = document.getElementById('inventoryTableBody');
    tbody.innerHTML = inventoryList.filter(i => 
      (i.part_no||'').toLowerCase().includes(kwd) || 
      (i.part_name||'').toLowerCase().includes(kwd) || 
      (i.category||'').toLowerCase().includes(kwd)
    ).map(i => {
      const safePartNo = escapeHtml(i.part_no);
      const safePartName = escapeHtml(i.part_name);
      const safeCategory = escapeHtml(i.category || '未分類');
      const safeBin = escapeHtml(i.bin_location || '');
      const safeImg = i.image_url ? escapeHtml(i.image_url) : '';
      const hasDesc = i.description && i.description.trim() !== '';
      const isInactive = i.status === 'INACTIVE';
      const statusClass = isInactive ? 'status-inactive' : '';

      const imgDisplay = safeImg 
        ? `<img src="${safeImg}" class="w-10 h-10 object-cover rounded shadow border border-slate-700">` 
        : `<div class="w-10 h-10 bg-slate-800 rounded flex items-center justify-center text-[10px] text-slate-500">無圖</div>`;

      return `
        <tr class="hover:bg-slate-800/40 ${statusClass}">
          <td class="p-2.5 flex justify-center">${imgDisplay}</td>
          <td class="p-2.5 leading-tight">
            <span class="font-mono text-sky-400 font-bold">${safePartNo}</span><br>
            <span class="text-[11px] text-slate-300">${safePartName}</span>
          </td>
          <td class="p-2.5">
            <span class="px-2 py-0.5 rounded text-[10px] bg-slate-800 border border-theme text-emerald-400 font-medium">${safeCategory}</span>
            <br>
            <div class="mt-1">
              ${hasDesc ? '<span class="text-[10px] text-amber-300 font-medium mr-2">📜 具溯源履歷</span>' : ''}
              ${isInactive ? '<span class="text-[10px] bg-rose-900/50 text-rose-300 px-1.5 rounded">已下架</span>' : '<span class="text-[10px] text-slate-400">上架中</span>'}
            </div>
          </td>
          <td class="p-2.5 leading-tight">
            <span class="${i.stock===0?'text-rose-400':'text-emerald-400'} font-bold">${i.stock} ${escapeHtml(i.unit||'件')}</span><br>
            <span class="font-mono text-amber-300 text-[10px]">儲位: ${safeBin}</span>
          </td>
          <td class="p-2.5 leading-tight">
            ¥${i.unit_price}<br>
            <span class="text-slate-500 text-[10px]">總額 ¥${(i.stock * i.unit_price)}</span>
          </td>
          <td class="p-2.5">
            <div class="flex flex-col gap-1.5 items-center">
              <button onclick="triggerImageUpload('${encodeURIComponent(i.part_no)}')" class="w-full px-2 py-1 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded text-[11px] text-white transition flex items-center justify-center gap-1">
                📷 換圖
              </button>
              <button onclick="toggleProductStatus('${safePartNo}', '${escapeHtml(i.status || 'ACTIVE')}')" class="w-full px-2 py-1 ${isInactive ? 'bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/40' : 'bg-amber-600/20 text-amber-300 hover:bg-amber-600/40'} border border-transparent rounded text-[11px] transition flex items-center justify-center gap-1">
                ${isInactive ? '🟢 重新上架' : '🟡 隱藏下架'}
              </button>
              <button onclick="deleteProduct('${safePartNo}')" class="w-full px-2 py-1 bg-rose-600/20 text-rose-400 hover:bg-rose-600/40 border border-transparent rounded text-[11px] transition flex items-center justify-center gap-1">
                🗑️ 刪除商品
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function triggerImageUpload(encodedPartNo) {
    if (!currentUser) return alert("請先登入系統才能更換圖片！");
    targetPartNoForUpload = decodeURIComponent(encodedPartNo);
    document.getElementById('imageUploader').click();
  }

  async function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file || !targetPartNoForUpload) return;
    if (file.size > 2 * 1024 * 1024) return alert("圖片太大！請選擇 2MB 以下的照片。");

    const fileExt = file.name.split('.').pop();
    const filePath = `images/${targetPartNoForUpload}_${Date.now()}.${fileExt}`;

    try {
      const { error: upErr } = await supabaseClient.storage.from('product-images').upload(filePath, file);
      if (upErr) throw upErr;

      const { data: pData } = supabaseClient.storage.from('product-images').getPublicUrl(filePath);
      const { error: dbErr } = await supabaseClient.from('products').update({ image_url: pData.publicUrl }).eq('part_no', targetPartNoForUpload);
      if (dbErr) throw dbErr;

      alert("圖片更新成功！");
      await fetchProducts();
    } catch (err) { 
      alert("上傳失敗: " + err.message); 
    } finally {
      document.getElementById('imageUploader').value = '';
      targetPartNoForUpload = null;
    }
  }

  async function fetchShopOrders() {
    const { data, error } = await supabaseClient.from('shop_orders').select('*').order('created_at', { ascending: false });
    if (error) {
      console.error("獲取訂單失敗:", error.message);
      return;
    }
    let pendingCount = 0;
    
    document.getElementById('ordersTableBody').innerHTML = (data || []).map(o => {
      const isShipped = o.order_status === 'SHIPPED' || o.shipping_status === '已發貨';
      if (!isShipped) pendingCount++;

      const displayOrderNo = escapeHtml(String(o.order_no || o.id || ''));
      const rName = escapeHtml(o.recipient_name || o.customer_name || '未填寫');
      const rPhone = escapeHtml(o.recipient_phone || o.customer_phone || '未填寫');
      const rAddr = escapeHtml(o.shipping_address || o.customer_address || '未填寫');
      const pMethod = escapeHtml(o.payment_method || '未知');
      const sMethod = escapeHtml(o.shipping_method || '未知');
      const trackingNo = escapeHtml(o.tracking_no || '');

      let orderItems = o.items;
      if (typeof orderItems === 'string') {
        try { orderItems = JSON.parse(orderItems); } catch(e) { orderItems = []; }
      }
      if (!Array.isArray(orderItems)) orderItems = [];

      const itemsHtml = orderItems.map(i => 
        `${escapeHtml(i.part_name || '商品')} x${Number(i.quantity || i.qty || 1)}`
      ).join('<br>') || '<span class="text-slate-500">無品項資料</span>';

      return `
        <tr class="hover:bg-slate-800/40">
          <td class="p-2.5 text-[11px] font-mono text-slate-400">
            <span class="text-sky-400 font-bold">${displayOrderNo}</span><br>${new Date(o.created_at).toLocaleString('zh-TW',{hour12:false})}
          </td>
          <td class="p-2.5 leading-tight">
            <strong class="text-white">${rName}</strong> (${rPhone})<br>
            <span class="text-slate-400 text-[10px] break-words max-w-[200px] inline-block">${rAddr}</span>
            <br><span class="text-[9px] text-amber-300">配送: ${sMethod} | 支付: ${pMethod}</span>
          </td>
          <td class="p-2.5 text-[10px] text-slate-300">${itemsHtml}</td>
          <td class="p-2.5 font-bold text-emerald-400">¥${Number(o.total_amount || 0)}</td>
          <td class="p-2.5">
            ${isShipped 
              ? `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-900 text-emerald-400">已出貨</span><br><span class="text-[10px] text-slate-500">${trackingNo}</span>` 
              : `<button onclick="shipOrder(${Number(o.id)})" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 rounded text-xs text-white font-bold transition">點擊發貨</button>`}
          </td>
        </tr>`;
    }).join('');
    document.getElementById('kpiPendingOrder').innerText = pendingCount;
  }

  async function shipOrder(orderId) {
    if (!currentUser) return alert("請先登入！");
    const track = prompt("請填寫快遞單號 (可選填)：");
    if (track === null) return;

    try {
      const { error } = await supabaseClient
        .from('shop_orders')
        .update({ 
          order_status: 'SHIPPED', 
          shipping_status: '已發貨', 
          tracking_no: track.trim() 
        })
        .eq('id', orderId);

      if (error) throw error;
      alert("發貨狀態已成功更新！");
      await fetchShopOrders();
    } catch (err) {
      alert("發貨更新失敗：" + err.message);
    }
  }

  function switchView(tab) {
    currentTab = tab;
    ['table', 'categories', 'orders', 'logs'].forEach(t => {
      document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).className = (tab === t) ? 'block' : 'hidden';
      document.getElementById('btnTab' + t.charAt(0).toUpperCase() + t.slice(1)).className = (tab === t) 
        ? 'px-3 py-1.5 rounded text-xs bg-sky-500 text-slate-900 font-semibold' 
        : 'px-3 py-1.5 rounded text-xs bg-slate-800 text-slate-300 border border-theme';
    });

    if (tab === 'categories') renderCategoriesTable();
    if (tab === 'orders') fetchShopOrders();
    if (tab === 'logs') {
      supabaseClient.from('inventory_transactions').select('*').order('created_at', { ascending: false }).limit(50).then(({ data, error }) => {
        if (error) {
          document.getElementById('logsTableBody').innerHTML = `<tr><td colspan="5" class="p-3 text-center text-rose-400">讀取日誌失敗: ${escapeHtml(error.message)}</td></tr>`;
          return;
        }
        document.getElementById('logsTableBody').innerHTML = (data || []).map(l => {
          const rawPartNo = l.part_no || (l.product_id ? `商品 #${l.product_id}` : '-');
          const rawType = l.trans_type || l.change_type || '-';
          const rawQty = (l.qty !== undefined && l.qty !== null) ? l.qty : (l.change_amount !== undefined ? l.change_amount : 0);
          const rawOp = l.operator || (l.change_type === 'SALE' ? '線上商城' : '系統');
          const rawBin = l.bin_location ? `<br><span class="text-[10px] text-amber-300/80 font-normal">${escapeHtml(l.bin_location)}</span>` : '';
          const isPositive = Number(rawQty) > 0 || rawType === 'IN';

          return `
            <tr class="hover:bg-slate-800/40">
              <td class="p-2.5 text-slate-400 text-[11px]">${new Date(l.created_at).toLocaleString('zh-TW',{hour12:false})}</td>
              <td class="p-2.5 text-indigo-300 text-[11px]">${escapeHtml(rawOp)}</td>
              <td class="p-2.5 font-mono text-sky-400 text-xs">${escapeHtml(rawPartNo)}</td>
              <td class="p-2.5 text-xs ${rawType === 'DELETE' ? 'text-rose-400 font-bold' : (isPositive ? 'text-emerald-400' : 'text-amber-400')}">
                ${rawType === 'DELETE' ? '🗑️ 商品清退' : escapeHtml(rawType)}
              </td>
              <td class="p-2.5 leading-tight">
                <span class="font-bold">${Number(rawQty)} 件</span>
                ${rawBin}
              </td>
            </tr>
          `;
        }).join('');
      });
    }
  }

  function toggleTransFields() { 
    document.getElementById('newSkuFields').className = document.getElementById('transType').value === 'NEW' ? 'space-y-2 border-l-2 border-sky-500 pl-2' : 'hidden'; 
  }
  
  async function executeTransaction() {
    if (!currentUser) return alert("無權限！請先登入");
    const t = document.getElementById('transType').value;
    const p = document.getElementById('partNo').value.toUpperCase().trim();
    const q = parseInt(document.getElementById('transQty').value);
    const b = document.getElementById('binLocation').value.toUpperCase().trim();

    if (!p || isNaN(q) || q <= 0) return alert("數量必須大於 0 且品號不能為空！");
    const i = inventoryList.find(x => x.part_no === p);
    if (t === 'NEW' && i) return alert("該品號已存在！");
    if (t !== 'NEW' && !i) return alert("品號不存在！");
    
    try {
      let res;
      if (t === 'NEW') {
        res = await supabaseClient.from('products').insert([{
          part_no: p,
          part_name: document.getElementById('partName').value.trim(),
          category: document.getElementById('partCategory').value,
          stock: q,
          bin_location: b,
          unit_price: parseFloat(document.getElementById('unitPrice').value) || 0,
          safety_stock: parseInt(document.getElementById('safetyStock').value) || 0,
          description: document.getElementById('partDesc').value.trim(),
          status: 'ACTIVE'
        }]);
      } else if (t === 'IN') {
        res = await supabaseClient.from('products').update({
          stock: i.stock + q,
          bin_location: b || i.bin_location
        }).eq('part_no', p);
      } else if (t === 'OUT') {
        if (i.stock < q) return alert("庫存不足！");
        res = await supabaseClient.from('products').update({
          stock: i.stock - q
        }).eq('part_no', p);
      }

      if (res && res.error) throw res.error;

      const { error: logErr } = await supabaseClient.from('inventory_transactions').insert([{
        part_no: p,
        trans_type: t,
        qty: q,
        bin_location: b,
        operator: currentUser.email
      }]);
      if (logErr) console.warn("日誌記錄提示:", logErr.message);

      document.getElementById('transQty').value = '';
      await fetchProducts();
      alert("庫存與溯源異動更新成功！");
    } catch (err) {
      alert("更新失敗：" + err.message);
    }
  }

  function exportCSV() {
    let csv = "\uFEFF品號,品名規格,類別,狀態,儲位,現存量,安全水位,單價,總值\n";
    inventoryList.forEach(i => {
      const cleanNo = String(i.part_no || '').replace(/^[=+\-@\t\r]/, "'");
      const cleanName = String(i.part_name || '').replace(/^[=+\-@\t\r]/, "'").replace(/"/g, '""');
      const cleanCat = String(i.category || '').replace(/^[=+\-@\t\r]/, "'").replace(/"/g, '""');
      const cleanStatus = (i.status === 'INACTIVE') ? "已下架" : "上架中";
      const cleanBin = String(i.bin_location || '').replace(/^[=+\-@\t\r]/, "'").replace(/"/g, '""');
      csv += `"${cleanNo}","${cleanName}","${cleanCat}","${cleanStatus}","${cleanBin}",${Number(i.stock||0)},${Number(i.safety_stock||0)},${Number(i.unit_price||0)},${Number((i.stock||0) * (i.unit_price||0))}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `艾產品台帳_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  fetchAllData();
</script>

<!-- 前端防審查與 DevTools 陷阱防護 -->
<script>
(function () {
  'use strict';

  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    return false;
  }, { capture: true });

  document.addEventListener('keydown', function (e) {
    const isModifier = e.ctrlKey || e.metaKey;
    const key = (e.key || '').toLowerCase();
    const keyCode = e.keyCode || e.which;

    if (key === 'f12' || keyCode === 123) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }

    if (isModifier) {
      if (key === 'u' || keyCode === 85) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (key === 's' || keyCode === 83) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (key === 'p' || keyCode === 80) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (e.shiftKey && ['i', 'j', 'c'].includes(key)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }
  }, { capture: true });

  let devToolsDetected = false;

  function triggerDefense() {
    if (devToolsDetected) return;
    devToolsDetected = true;

    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#0a0f1d;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box;">
        <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
        <h2 style="font-size:22px;margin:0 0 12px;color:#ef4444;font-weight:700;">系統安全防護觸發</h2>
        <p style="font-size:14px;color:#94a3b8;line-height:1.6;max-width:480px;margin:0 0 20px;">
          偵測到異常的除錯環境或開發人員工具已啟動。為保護交易連線與資料安全性，當前存取作業已終止。
        </p>
        <button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;">
          關閉除錯工具後重新載入
        </button>
      </div>
    `;
  }

  function checkDebugger() {
    const startTime = performance.now();
    debugger;
    if (performance.now() - startTime > 100) {
      triggerDefense();
    }
  }

  setInterval(function () {
    try {
      checkDebugger();
    } catch (err) {}
  }, 800);

  try {
    const noop = function () {};
    ['log', 'debug', 'info', 'warn', 'error'].forEach(function (method) {
      console[method] = noop;
    });
  } catch (err) {}
})();
</script>
</body>
