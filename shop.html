<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>艾草生活館 - 產品展銷中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    /* 自訂單選框樣式 */
    input[type="radio"]:checked + div { border-color: currentColor; background-color: #f8fafc; }
    .radio-wechat:checked + div { border-color: #059669; color: #059669; background-color: #ecfdf5; }
    .radio-alipay:checked + div { border-color: #0284c7; color: #0284c7; background-color: #f0f9ff; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽 -->
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌿</span>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-wide">艾草生活體驗館 · 展銷下單</h1>
          <p class="text-[11px] text-emerald-200">產地直送 · 微信/支付寶 · 快遞到府</p>
        </div>
      </div>
      
      <button onclick="toggleCartDrawer()" class="relative bg-emerald-800 hover:bg-emerald-700 px-3.5 py-2 rounded-full flex items-center gap-2 transition">
        <span>🛒 購物車</span>
        <span id="cartCountBadge" class="bg-amber-400 text-slate-900 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- 分類切換 -->
    <div class="flex gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none" id="categoryFilter">
      <button onclick="filterCategory('ALL')" class="category-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-800 text-white shadow-sm">全部商品</button>
      <button onclick="filterCategory('傳統灸條/艾柱')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200">傳統灸條/艾柱</button>
      <button onclick="filterCategory('艾絨原料')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200">艾絨原料</button>
      <button onclick="filterCategory('艾灸器具/儀器')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200">艾灸器具/儀器</button>
      <button onclick="filterCategory('草本貼膏/精油')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200">草本貼膏/精油</button>
      <button onclick="filterCategory('日用洗沐衍生品')" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200">日用洗沐衍生品</button>
    </div>

    <!-- 產品卡片網格 -->
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <div class="col-span-full py-12 text-center text-slate-400 text-sm">正在載入商品中...</div>
    </div>
  </main>

  <!-- 購物車與結帳抽屜 -->
  <div id="cartDrawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h2 class="font-bold text-slate-800 flex items-center gap-1.5"><span>🛍️</span> 結帳與收件資訊</h2>
      <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- 購買商品列表 -->
      <div id="cartItemList" class="space-y-2"></div>

      <!-- 發貨資料填寫區 -->
      <div class="border-t border-slate-200 pt-3 space-y-2.5">
        <h3 class="text-xs font-bold text-slate-700 flex items-center gap-1"><span>📦</span> 收件人發貨資料</h3>
        
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-slate-500 mb-1">收件人姓名 *</label>
            <input type="text" id="orderName" placeholder="如：張先生" class="w-full bg-slate-50 border border-slate-200 rounded p-2 outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block text-slate-500 mb-1">聯絡電話 *</label>
            <input type="tel" id="orderPhone" placeholder="手機號碼" class="w-full bg-slate-50 border border-slate-200 rounded p-2 outline-none focus:border-emerald-600">
          </div>
        </div>

        <div class="text-xs">
          <label class="block text-slate-500 mb-1">送貨方式</label>
          <select id="orderDeliveryType" class="w-full bg-slate-50 border border-slate-200 rounded p-2 outline-none">
            <option value="快遞寄送">快遞包郵寄送至指定地址</option>
            <option value="現場自提">現場展台自提</option>
          </select>
        </div>

        <div class="text-xs">
          <label class="block text-slate-500 mb-1">詳細收貨地址 *</label>
          <textarea id="orderAddress" rows="2" placeholder="省、市、區、詳細街道門牌號（自提可填展位號）" class="w-full bg-slate-50 border border-slate-200 rounded p-2 outline-none focus:border-emerald-600"></textarea>
        </div>
      </div>

      <!-- 支付方式選擇區 -->
      <div class="border-t border-slate-200 pt-3 space-y-2">
        <h3 class="text-xs font-bold text-slate-700">💳 選擇支付方式</h3>
        <div class="grid grid-cols-2 gap-2">
          <label class="relative cursor-pointer">
            <input type="radio" name="payMethod" value="wechat" class="peer sr-only radio-wechat" checked>
            <div class="flex items-center justify-center gap-2 p-2 border border-slate-200 rounded-lg text-slate-600 transition">
              <span class="text-lg">💬</span> <span class="text-xs font-bold">微信支付</span>
            </div>
          </label>
          <label class="relative cursor-pointer">
            <input type="radio" name="payMethod" value="alipay" class="peer sr-only radio-alipay">
            <div class="flex items-center justify-center gap-2 p-2 border border-slate-200 rounded-lg text-slate-600 transition">
              <span class="text-lg">🔷</span> <span class="text-xs font-bold">支付寶</span>
            </div>
          </label>
        </div>
      </div>

    </div>

    <!-- 底部付款按鈕 -->
    <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-2">
      <div class="flex justify-between items-baseline">
        <span class="text-xs text-slate-500">應付總額</span>
        <span class="text-2xl font-bold text-emerald-800" id="cartTotalText">¥0</span>
      </div>
      <button onclick="openPayModal()" id="btnGoPay" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg shadow-md flex items-center justify-center gap-2 text-sm disabled:bg-slate-300">
        前往掃碼結算
      </button>
    </div>
  </div>

  <div id="cartBackdrop" onclick="toggleCartDrawer()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

  <!-- 掃碼結算 Modal (動態切換微信/支付寶樣式) -->
  <div id="payModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <span id="payModalTitle" class="text-xs font-bold flex items-center gap-1"></span>
        <button onclick="closePayModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="text-slate-500 text-xs">應付金額</div>
      <div class="text-3xl font-extrabold text-slate-900" id="payModalAmount">¥0</div>

      <!-- 收款二維碼展示區 -->
      <div id="qrCodeContainer" class="p-3 rounded-xl border inline-block">
        <img id="payQrImg" src="" alt="收款碼" class="w-48 h-48 mx-auto rounded-lg object-contain">
        <p id="payInstruction" class="text-[11px] mt-2"></p>
      </div>

      <div class="text-[11px] text-amber-600 bg-amber-50 p-2 rounded text-left">
        💡 提示：掃碼付款後請點擊下方按鈕，後台將立即為您安排打包發貨！
      </div>

      <button onclick="confirmPaidAndSubmit()" id="btnConfirmPaid" class="w-full py-2.5 text-white font-bold rounded-lg text-xs shadow-md">
        我已完成付款，立即送出訂單
      </button>
    </div>
  </div>

  <script>
    // ========== ⚠️ 設定區 ⚠️ ==========
    const FIXED_SUPABASE_URL = "https://xayagdicjwexwtehdjby.supabase.co";
    const FIXED_SUPABASE_KEY = "sb_publishable_ehe3Q13ZWq3552zzWQmGvg_2RnhkJIV";

    // 💡 請將以下網址替換為您真實的收款碼圖片網址 (可上傳到圖床或 Supabase Storage 獲取公開連結)
    // 範例：使用 api.qrserver.com 產生測試用二維碼
    const WECHAT_PAY_QR_URL = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=WechatPay-YourMoxaStore"; 
    const ALIPAY_QR_URL = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Alipay-YourMoxaStore";
    // =================================

    let supabaseClient = null;
    let catalogProducts = [];
    let cart = [];
    let currentCategory = 'ALL';
    let selectedPayMethod = 'wechat'; // 預設支付方式

    function initStore() {
      supabaseClient = supabase.createClient(FIXED_SUPABASE_URL, FIXED_SUPABASE_KEY);
      fetchCatalog();
    }

    async function fetchCatalog() {
      const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!error) {
        catalogProducts = data || [];
        renderProducts();
      }
    }

    // 渲染商品列表 (含圖片)
    function renderProducts() {
      const container = document.getElementById('productGrid');
      const filtered = currentCategory === 'ALL' 
        ? catalogProducts 
        : catalogProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">此分類暫無商品。</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isOutOfStock = item.stock <= 0;
        const displayImg = item.image_url || 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=400&auto=format&fit=crop&q=60';

        return `
          <div class="bg-white rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden">
            <div class="relative w-full h-36 bg-slate-100">
              <img src="${displayImg}" alt="${item.part_name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=400&auto=format&fit=crop&q=60'">
              <span class="absolute top-2 left-2 text-[10px] bg-black/60 text-white px-2 py-0.5 rounded-full backdrop-blur-sm">${item.category}</span>
            </div>
            
            <div class="p-3 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-slate-800 text-xs line-clamp-2 mb-1">${item.part_name}</h3>
                <p class="text-[10px] text-slate-400 font-mono mb-2">品號: ${item.part_no}</p>
              </div>
              
              <div class="pt-2 border-t border-slate-50 flex items-center justify-between">
                <div>
                  <span class="text-[10px] text-slate-400">展銷價</span>
                  <div class="text-sm font-bold text-emerald-800">¥${item.unit_price}</div>
                </div>
                
                <button 
                  onclick="addToCart('${item.part_no}')" 
                  ${isOutOfStock ? 'disabled' : ''}
                  class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${
                    isOutOfStock 
                      ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                      : 'bg-emerald-800 hover:bg-emerald-700 text-white'
                  }">
                  ${isOutOfStock ? '已售罄' : '+ 加入'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 切換分類
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = btn.innerText === (cat === 'ALL' ? '全部商品' : cat)
          ? 'category-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-emerald-800 text-white shadow-sm'
          : 'category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200';
      });
      renderProducts();
    }

    // 購物車操作
    function addToCart(partNo) {
      const product = catalogProducts.find(p => p.part_no === partNo);
      if (!product) return;

      const cartItem = cart.find(i => i.part_no === partNo);
      if (cartItem) {
        if (cartItem.qty + 1 > product.stock) return alert(`現場庫存僅剩 ${product.stock} 件！`);
        cartItem.qty += 1;
      } else {
        cart.push({
          part_no: product.part_no,
          part_name: product.part_name,
          unit_price: product.unit_price,
          unit: product.unit || '件',
          maxStock: product.stock,
          qty: 1
        });
      }
      updateCartUI();
    }

    function changeQty(partNo, delta) {
      const idx = cart.findIndex(i => i.part_no === partNo);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.qty * item.unit_price), 0);

      document.getElementById('cartCountBadge').innerText = totalCount;
      document.getElementById('cartTotalText').innerText = `¥${totalPrice.toLocaleString()}`;
      
      const btnGoPay = document.getElementById('btnGoPay');
      btnGoPay.disabled = cart.length === 0;
      
      // 動態更新結帳按鈕樣式 (依據目前選擇的支付方式)
      selectedPayMethod = document.querySelector('input[name="payMethod"]:checked').value;
      if (selectedPayMethod === 'wechat') {
         btnGoPay.className = "w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg shadow-md flex items-center justify-center gap-2 text-sm disabled:bg-slate-300";
         btnGoPay.innerHTML = "<span>💬</span> 微信掃碼結算";
      } else {
         btnGoPay.className = "w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg shadow-md flex items-center justify-center gap-2 text-sm disabled:bg-slate-300";
         btnGoPay.innerHTML = "<span>🔷</span> 支付寶結算";
      }

      const container = document.getElementById('cartItemList');
      if (cart.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-6 text-xs">購物車是空的</div>';
        return;
      }

      container.innerHTML = cart.map(i => `
        <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100">
          <div class="flex-1 pr-2">
            <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${i.part_name}</h4>
            <div class="text-[11px] text-emerald-800 font-semibold">¥${i.unit_price}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty('${i.part_no}', -1)" class="w-5 h-5 bg-white border border-slate-200 rounded text-xs">-</button>
            <span class="text-xs font-bold">${i.qty}</span>
            <button onclick="changeQty('${i.part_no}', 1)" class="w-5 h-5 bg-white border border-slate-200 rounded text-xs">+</button>
          </div>
        </div>
      `).join('');
    }

    // 監聽支付方式切換，即時更新結帳按鈕樣式
    document.querySelectorAll('input[name="payMethod"]').forEach(radio => {
       radio.addEventListener('change', updateCartUI);
    });

    function toggleCartDrawer() {
      const drawer = document.getElementById('cartDrawer');
      const backdrop = document.getElementById('cartBackdrop');
      const isOpen = !drawer.classList.contains('translate-x-full');
      drawer.classList.toggle('translate-x-full', isOpen);
      backdrop.classList.toggle('hidden', isOpen);
    }

    // 彈出支付視窗 (根據選擇動態替換樣式與二維碼)
    function openPayModal() {
      const name = document.getElementById('orderName').value.trim();
      const phone = document.getElementById('orderPhone').value.trim();
      const addr = document.getElementById('orderAddress').value.trim();

      if (!name || !phone || !addr) {
        alert("請完整填寫收件人姓名、電話及收貨地址，以便為您安排發貨！");
        return;
      }

      const totalPrice = cart.reduce((sum, item) => sum + (item.qty * item.unit_price), 0);
      document.getElementById('payModalAmount').innerText = `¥${totalPrice.toLocaleString()}`;
      
      const title = document.getElementById('payModalTitle');
      const qrContainer = document.getElementById('qrCodeContainer');
      const qrImg = document.getElementById('payQrImg');
      const instruction = document.getElementById('payInstruction');
      const btnConfirm = document.getElementById('btnConfirmPaid');

      selectedPayMethod = document.querySelector('input[name="payMethod"]:checked').value;

      if (selectedPayMethod === 'wechat') {
         // 微信樣式 (綠色)
         title.innerHTML = '<span>💬</span> 微信安全支付';
         title.className = 'text-xs font-bold flex items-center gap-1 text-emerald-700';
         qrContainer.className = 'p-3 rounded-xl border border-emerald-100 bg-emerald-50 inline-block';
         qrImg.src = WECHAT_PAY_QR_URL;
         instruction.innerText = '請打開微信「掃一掃」完成支付';
         instruction.className = 'text-[11px] mt-2 text-emerald-600';
         btnConfirm.className = 'w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs shadow-md';
      } else {
         // 支付寶樣式 (藍色)
         title.innerHTML = '<span>🔷</span> 支付寶安全支付';
         title.className = 'text-xs font-bold flex items-center gap-1 text-sky-700';
         qrContainer.className = 'p-3 rounded-xl border border-sky-100 bg-sky-50 inline-block';
         qrImg.src = ALIPAY_QR_URL;
         instruction.innerText = '請打開支付寶「掃一掃」完成支付';
         instruction.className = 'text-[11px] mt-2 text-sky-600';
         btnConfirm.className = 'w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg text-xs shadow-md';
      }

      document.getElementById('payModal').classList.remove('hidden');
      document.getElementById('payModal').classList.add('flex');
    }

    function closePayModal() {
      document.getElementById('payModal').classList.add('hidden');
      document.getElementById('payModal').classList.remove('flex');
    }

    // 顧客確認已付款，提交訂單
    async function confirmPaidAndSubmit() {
      const btn = document.getElementById('btnConfirmPaid');
      btn.disabled = true;
      btn.innerText = "正在為您提交訂單...";

      const name = document.getElementById('orderName').value.trim();
      const phone = document.getElementById('orderPhone').value.trim();
      const addr = document.getElementById('orderAddress').value.trim();
      const delType = document.getElementById('orderDeliveryType').value;
      const totalPrice = cart.reduce((sum, item) => sum + (item.qty * item.unit_price), 0);
      
      // 依據支付方式產生訂單前綴 (WX=微信, AL=支付寶)
      const prefix = selectedPayMethod === 'wechat' ? 'WX' : 'AL';
      const orderNo = prefix + Date.now().toString().slice(-8);

      try {
        // 1. 寫入 shop_orders
        const { error: orderErr } = await supabaseClient.from('shop_orders').insert([{
          order_no: orderNo,
          customer_name: name,
          customer_phone: phone,
          customer_address: addr,
          delivery_type: delType,
          total_amount: totalPrice,
          items: cart,
          pay_status: '已付款(待核對)',
          shipping_status: '待發貨'
        }]);

        if (orderErr) throw orderErr;

        // 2. 扣減庫存與記錄流水
        for (const item of cart) {
          const product = catalogProducts.find(p => p.part_no === item.part_no);
          if (product) {
            await supabaseClient.from('products')
              .update({ stock: product.stock - item.qty })
              .eq('part_no', item.part_no);

            const methodStr = selectedPayMethod === 'wechat' ? '微信' : '支付寶';
            await supabaseClient.from('inventory_transactions').insert([{
              part_no: item.part_no,
              trans_type: 'OUT',
              qty: item.qty,
              bin_location: product.bin_location,
              operator: `${methodStr}展銷(${orderNo})`
            }]);
          }
        }

        alert(`下單成功！\n訂單號：${orderNo}\n我們已收到您的收貨地址，將盡快安排發貨！`);
        cart = [];
        updateCartUI();
        closePayModal();
        toggleCartDrawer();
        
        // 清空表單
        document.getElementById('orderName').value = '';
        document.getElementById('orderPhone').value = '';
        document.getElementById('orderAddress').value = '';
        
        fetchCatalog();

      } catch (err) {
        alert("訂單提交失敗: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "我已完成付款，立即送出訂單";
      }
    }

    window.addEventListener('DOMContentLoaded', initStore);
  </script>
</body>
</html>
